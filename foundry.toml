[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
gas_limit = "18446744073709551615"
memory_limit = 1073741824
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[profile.default.fuzz]
runs = 512

[profile.ci.fuzz]
runs = 4096

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = true

[profile.ci.invariant]
runs = 256
depth = 128
fail_on_revert = true
