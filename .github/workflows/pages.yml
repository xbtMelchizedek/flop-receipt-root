name: pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      # Latest devnet hour, every leaf cross-checked on chain. Unsigned (CI holds no keys). If devnet is quiet or
      # the explorer/RPC is down, the page shows the signed test epoch only.
      - run: mkdir -p web-data && node src/cli.mjs build --network devnet --last 3600 --max 1000 --out web-data/latest.json
        continue-on-error: true
      - run: node scripts/build-web.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
